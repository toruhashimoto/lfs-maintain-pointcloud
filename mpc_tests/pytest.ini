#
# Makes mpc_tests its own rootdir.
#
# The repository root is a Python package: its __init__.py is the plugin
# entry point and imports `lichtfeld`, which only exists inside the host
# application. With the root as pytest's rootdir, pytest builds a
# <Package lfs-maintain-pointcloud> node and imports that __init__.py during
# collection setup, so every test errors with ModuleNotFoundError before it
# runs. Anchoring the rootdir here keeps the root package out of the
# collection tree, which is the whole point of testing the pure modules
# (stats_policy, drift_stats, venv_bootstrap, calibration, shape_stats)
# without the embedded interpreter.

[pytest]
