[project]
name = "maintain_pointcloud"
version = "1.0.0"
description = "Keep 3DGS true to a pre-placed point cloud in LichtFeld Studio: soft position anchor during training (LI-GS / GeomGS / EnerGS-inspired) + input-cloud crop before training (RealityScan-style region of interest)"
authors = [{ name = "Toru Hashimoto" }]
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[tool.lichtfeld]
hot_reload = true
plugin_api = ">=1,<2"
lichtfeld_version = ">=0.4.2"
required_features = []
